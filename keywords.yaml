# ============================================================
# 個人情報収集システム 全体設定
# カテゴリーごとの設定は categories/ フォルダ（1カテゴリー = 1ファイル）にあります
# ============================================================

# ntfy 通知設定
# NTFY_TOPIC は GitHub Secret に設定してください（ここには書かない）
ntfy:
  server: "https://ntfy.sh"

# 収集設定
settings:
  max_articles_per_keyword: 8   # Google ニュースの検索語1件あたりの最大取得件数
  max_total_articles: 800       # 保持する記事の最大件数
  retention_days: 7             # 記事の保持日数（これより古い記事は取り込まない）

# 全カテゴリー共通の除外ワード（この語を含む記事は取り込まない）
exclude: []
