name: 酒屋の新着チェック

# fast: true のカテゴリー（酒屋の入荷情報など）だけを、日本時間 9:00〜20:00 の間に
# 約2時間おきに確認し、新着があれば保存してスマホに通知する。
#
# GitHub の定期実行は混雑すると数時間遅れたり、実行自体が飛ばされたりする
# （2時間おきに予約しても、1日に2回ほどしか動かない日があった）。そこで毎時起動を予約し、
# 実際に動いた回のうち「前回の確認から100分以上たっている回」だけが確認する。
# 遅れて 20:00 を過ぎた回は何もせずに終える（夜間に通知を出さないため）。
on:
  schedule:
    # UTC で指定。日本時間 9:23〜19:23 の毎時（混みやすい毎時0分は避ける）
    - cron: "23 0-10 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 通常の記事収集と同じグループで順番に実行する（待機中の古い実行は新しい実行で置き換わってよい）
concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-news-${{ hashFiles('news_requirements.txt') }}
          restore-keys: pip-news-

      # 定期実行のとき、確認するかを決める（手動実行はいつでも確認する）
      #  - 9:00〜20:00（日本時間）の外にずれ込んだ回は確認しない
      #  - 前回の確認から100分たっていない回は確認しない（毎時起動しているため）
      - name: Check the time window
        id: window
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          jst = timezone(timedelta(hours=9))
          now = datetime.now(jst)
          run, reason = True, "手動実行"
          if os.environ["EVENT"] == "schedule":
              try:
                  last = json.load(open("docs/data/status.json", encoding="utf-8")).get("fast_checked")
                  last = datetime.fromisoformat(last) if last else None
              except (OSError, ValueError):
                  last = None
              if not 9 <= now.hour < 20:
                  run, reason = False, f"日本時間 {now:%H:%M} は確認する時間帯（9:00〜20:00）の外"
              elif last and now - last < timedelta(minutes=100):
                  run, reason = False, f"前回の確認（{last:%H:%M}）から100分たっていない"
              else:
                  reason = f"前回の確認: {last:%m/%d %H:%M}" if last else "前回の確認なし"
          print(("確認します: " if run else "確認しません: ") + reason)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          PY

      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: pip install -r news_requirements.txt

      # push がほかの更新とぶつかったら、最新の main で確認し直す（JSON はマージしない）
      - name: Check and push
        if: steps.window.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            python news_collector.py --fast
            git add docs/data state
            git diff --staged --quiet && echo "変更なし" && exit 0
            # 新着が無い回もチェック時刻（docs/data/status.json）だけは保存する
            if git diff --staged --quiet -- docs/data/articles.json; then
              git commit -m "🍶 チェック（新着なし） $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            else
              git commit -m "🍶 新着 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            fi
            git push && exit 0
            echo "push が他の更新とぶつかったため、最新の状態で確認し直します ($i)"
            sleep 10
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
