name: 個人情報収集システム

on:
  schedule:
    - cron: "0 22 * * *"   # 7:00 JST
    - cron: "0 3 * * *"    # 12:00 JST
    - cron: "0 9 * * *"    # 18:00 JST
    - cron: "0 13 * * *"   # 22:00 JST
  workflow_dispatch:

permissions:
  contents: write

# 記事収集どうしは重ならないよう順番に実行する（待機中の古い実行は新しい実行で置き換わってよい）
concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-news-${{ hashFiles('news_requirements.txt') }}
          restore-keys: pip-news-

      - name: Install dependencies
        run: pip install -r news_requirements.txt

      # 記事を集めて保存する。カテゴリー変更などが先に push していたら、最新の main で集め直す
      # （articles.json を自動マージすると JSON が壊れうるので、マージはしない）
      - name: Collect articles and push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            python news_collector.py
            git add docs/data
            git diff --staged --quiet && echo "変更なし" && exit 0
            git commit -m "📰 記事更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push && exit 0
            echo "push が他の更新とぶつかったため、最新の状態から集め直します ($i)"
            sleep 10
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
