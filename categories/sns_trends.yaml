name: "SNS炎上・バズ"
emoji: "🔥"
order: 80
lang: "ja"
notify: true
priority: "default"
# 急上昇ワードは毎回入れ替わり件数が多いので、保持する件数を抑える
max_articles: 150

# Yahoo!リアルタイム検索（X の投稿をリアルタイムに集計）から取得
yahoo_realtime:
  trend_words: 8           # 急上昇ワードの取得件数（上位から）
  trend_min_tweets: 100    # ツイート数がこれ未満の急上昇ワードは除外
  enjo_negative_pct: 50    # 否定的な投稿がこの割合(%)以上の急上昇ワードは「炎上」扱い
  matome: 5                # Yahoo が投稿を要約した「話題まとめ」の取得件数
  searches:                # 検索語を含む、直近24時間でいいね数の多い投稿を拾う
    - keyword: "炎上"
      min_likes: 1000      # このいいね数以上の投稿だけ
      limit: 8
    - keyword: "謝罪"
      min_likes: 1000
      limit: 5

exclude: []

feeds:
  - name: "はてなブックマーク"
    url: "https://b.hatena.ne.jp/hotentry/all.rss"
    keyword: "ネットで話題"
    limit: 8
