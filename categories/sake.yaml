name: 日本酒
emoji: 🍶
order: 20
lang: ja
notify: true
priority: "high"
# 札幌市内で評判の良い酒屋の「入荷・新着・予約」情報を、お店の発信元から直接集める。
# ニュースサイトは使わない（一般のニュースや事件の記事が混ざるため）。
# fast: true のカテゴリーは、通常の収集（約2時間おき・夜間も）ではなく「酒屋の新着チェック」で
# 日本時間 9:00〜20:00 の間に約2時間おきに確認する（.github/workflows/fast_collector.yml）。
# GitHub の定期実行は遅れや取りこぼしがあるため、30分おきに起動して100分以上あいた回だけ確認する
fast: true

keywords: []

exclude: []

# お店の X（旧Twitter）。Yahoo!リアルタイム検索の「ID:アカウント」で投稿を取得する
x_accounts:
  - id: "sakenomarumi"
    name: "酒のマルミ"        # 東区。全国の銘酒1,500種類以上。入荷投稿が多い
  - id: "nemotoshoten"
    name: "北海道根本商店"    # 南区真駒内。日本酒とウイスキー
# この語を含む投稿だけを取り込む（営業案内や日常の投稿は除く）
x_match:
  - "入荷"
  - "新着"
  - "入りました"
  - "到着"
  - "予約"
  - "抽選"
  - "発売"
  - "販売開始"
  - "解禁"
  - "限定"

# お店のネットショップ（MakeShop）。ページに新しく並んだ商品・お知らせを新着として取り込む
shop_pages:
  - name: "ワインフードわたらい"
    url: "https://www.winefood.jp/"     # 西区西町北（宮の沢）。北海道限定の地酒と世界のワイン
  - name: "桜本商店"
    url: "https://ontable.jp/"          # 中央区。明治43年創業。『而今』抽選販売などのお知らせも
    news_match: ["抽選", "入荷", "予約", "限定", "発売", "販売"]   # 営業日の案内などは除く
  - name: "酒のマルミ"
    url: "https://www.3000.co.jp/"      # 東区。入荷は X で追っているので、ここはお知らせ（抽選・入荷系）だけ
    products: false                     # トップページは定番品が並ぶだけなので見ない
    news_match: ["抽選", "入荷", "予約", "限定", "発売"]

# お店のホームページ・オンラインショップの新着情報（RSS）
feeds:
  - name: "地酒仙丸"
    url: "https://senmaru.shop-pro.jp/?mode=rss"      # 南区石山。オンラインショップの新着商品
    keyword: "新着商品"
    limit: 15
  - name: "酒本商店"
    url: "https://sakemoto.org/?mode=rss"             # 中央区。純米酒に強い。オンラインショップの新着商品
    keyword: "新着商品"
    limit: 15
  - name: "早坂商店"
    url: "https://sakenohayasaka.com/feed/"           # 東区。予約受付などのお知らせ
    keyword: "お知らせ"
    limit: 5

# Instagram・Facebook 中心のお店（酒舗七蔵・銘酒の裕多加など）は、ログインが必要で
# 自動取得できないため入れていない
