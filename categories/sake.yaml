name: "日本酒"
emoji: "🍶"
order: 20
lang: "ja"
notify: true
priority: "default"

keywords:
  - "日本酒 札幌"
  - "日本酒 北海道 新商品"
  - "日本酒 北海道 イベント"
  - "日本酒 北海道 限定"
  - "十四代 札幌"
  - "新政 北海道"
  - "而今 北海道"
  - "獺祭 札幌"
  - "鍋島 北海道"

# 「札幌」「北海道」で検索すると事件・事故の記事が混ざるので除外する
exclude:
  - "飲酒運転"
  - "酒気帯び"
  - "事故"
  - "はねられ"
  - "衝突"
  - "突っ込"
  - "逮捕"
  - "容疑"

feeds:
  - name: "PR TIMES"
    url: "https://prtimes.jp/index.rdf"
    match:
      - "日本酒 北海道"
      - "日本酒 札幌"
      - "酒蔵 北海道"
