<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <title>マイニュース</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
  <link rel="stylesheet" href="assets/news.css?v=4">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="topbar-row">
      <a class="brand" href="#">
        <h1>マイニュース</h1>
        <span class="stamp" id="stamp">読み込み中…</span>
      </a>
      <button class="icon-btn" id="search-toggle" type="button" aria-pressed="false" aria-label="検索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <a class="icon-btn" id="settings-link" href="#settings" aria-label="カテゴリー管理">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </a>
    </div>
    <div class="search-row" id="search-row" hidden>
      <input type="search" id="search" placeholder="見出し・媒体名で検索" enterkeyhint="search" autocomplete="off">
    </div>
    <nav class="chips" id="chips" aria-label="カテゴリー"></nav>
  </div>
</header>

<main class="wrap" id="view-news">
  <section class="trends" id="trends" aria-label="いま急上昇のワード" hidden></section>
  <div class="toolbar">
    <span class="count" id="count"></span>
    <button class="toggle" id="unread-toggle" type="button" aria-pressed="false">未読のみ</button>
    <button class="text-btn" id="mark-all" type="button">すべて既読</button>
  </div>
  <div id="feed"><div class="loading">読み込み中…</div></div>
</main>

<main class="wrap" id="view-settings" hidden>
  <section class="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">カテゴリー管理</h2>
    <p class="lead">追加・編集・削除を押すと、GitHub の「Issue（依頼票）」画面が入力済みで開きます。そこで「Create」（送信）を押すと、数分後にこのサイトへ反映されます。GitHub へのログインが必要です。</p>
    <div id="pending"></div>
    <button class="btn primary block" id="add-category" type="button">＋ カテゴリーを追加</button>
    <div id="category-list" class="settings" style="padding:0"></div>
    <p class="foot"><a class="text-btn" href="#">← ニュースに戻る</a></p>
  </section>
</main>

<dialog class="sheet" id="sheet">
  <form id="category-form" method="dialog" novalidate>
    <h2 id="sheet-title">カテゴリーを追加</h2>
    <div class="inline">
      <label class="field">
        <span>絵文字</span>
        <input name="emoji" maxlength="8" placeholder="📰">
      </label>
      <label class="field">
        <span>名前</span>
        <input name="name" maxlength="30" required placeholder="例: ラーメン">
      </label>
    </div>
    <label class="field">
      <span>検索キーワード</span>
      <textarea name="keywords" placeholder="例:&#10;札幌 ラーメン 新店&#10;札幌 ラーメン オープン"></textarea>
      <small>1行に1つ。Google ニュースでこの語を検索します。空白で区切ると「両方を含む」記事になります。</small>
    </label>
    <label class="field">
      <span>除外ワード（任意）</span>
      <textarea name="exclude" placeholder="例:&#10;閉店&#10;事故"></textarea>
      <small>この語を含む記事は取り込みません。1行に1つ。</small>
    </label>
    <div class="field">
      <span>記事の言語</span>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="lang" value="ja" checked><span>日本語</span></label>
        <label><input type="radio" name="lang" value="en"><span>英語（日本語に翻訳）</span></label>
      </div>
    </div>
    <label class="check"><input type="checkbox" name="notify"> 新着をスマホに通知する</label>
    <details class="adv">
      <summary>RSS を追加する（上級者向け・任意）</summary>
      <div class="adv-body">
        <label class="field">
          <span>RSS の名前</span>
          <input name="feed_name" placeholder="例: PR TIMES">
        </label>
        <label class="field">
          <span>RSS の URL</span>
          <input name="feed_url" type="url" inputmode="url" placeholder="https://…">
        </label>
        <label class="field">
          <span>取り込む記事の条件（任意）</span>
          <textarea name="feed_match" placeholder="例:&#10;ラーメン 札幌"></textarea>
          <small>どれかの語を含む記事だけ取り込みます。1行に1つ。空なら全部。</small>
        </label>
      </div>
    </details>
    <p class="err" id="form-error" hidden></p>
    <div class="sheet-actions">
      <button class="btn" type="button" id="sheet-cancel">やめる</button>
      <button class="btn primary" type="submit" id="sheet-submit">GitHub で送信へ</button>
    </div>
  </form>
</dialog>

<script src="assets/news.js?v=4"></script>
</body>
</html>
